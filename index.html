<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --bg:#F3F4F1;--panel:#FFFFFF;--ink:#1D2226;--sub:#5C646B;--line:#D9DCD5;--grid:#ECEEE8;--head:#E8ECF1;
  --accent:#24548A;--accent-2:#3C78B8;--soft:#DDE7F2;--bar:#2F64A6;--bar-leaf:#8FB3DC;--bar-end:#C2362B;
  --late:#B8412F;--late-soft:#F6DFDA;--warn-soft:#F6EBCB;--done:#3D7A4C;--done-soft:#DCEEDF;--today:#E2A400;--wkend:#F2F3EF;
  --s:#B8412F;--a:#C27A00;--b:#3C78B8;--c:#7A838B;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px;line-height:1.55;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;white-space:nowrap}
header .brand small{font-weight:400;color:var(--sub);margin-left:6px;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--sub);white-space:nowrap}
nav button.on{background:var(--soft);color:var(--accent);font-weight:700}
nav .badge{display:inline-block;background:var(--late);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-left:4px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.who select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.viewing{background:var(--warn-soft);color:#6B4A00;padding:8px 20px;font-size:13px;border-bottom:1px solid #E5D49F}
main{padding:20px;max-width:1800px;margin:0 auto}
h2{font-size:19px;margin:4px 0 6px}
.lead{color:var(--sub);margin:0 0 16px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;white-space:nowrap}
.btn:hover{border-color:#B9BFB4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 10px;font-size:12px}
.btn.danger{color:var(--late);border-color:#E3B9B1}
.btn.on{background:var(--soft);border-color:var(--accent-2);color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:8px 0 0 8px}.seg .btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);white-space:nowrap}
.toolbar select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:420px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--grid);font-size:12px;margin:2px 3px 2px 0;line-height:1.5}
.chip.link{cursor:pointer;background:var(--soft);color:var(--accent)}
.pri{display:inline-block;min-width:24px;text-align:center;border-radius:5px;color:#fff;font-weight:700;font-size:12px;padding:1px 6px}
.pri.S{background:var(--s)}.pri.A{background:var(--a)}.pri.B{background:var(--b)}.pri.C{background:var(--c)}
.st{font-size:12px;padding:2px 8px;border-radius:5px;white-space:nowrap}
.st.未着手{background:var(--grid);color:var(--sub)}.st.進行中{background:var(--soft);color:var(--accent)}
.st.完了{background:var(--done-soft);color:var(--done)}.st.保留{background:var(--warn-soft);color:#6B4A00}
.late-tag{color:var(--late);font-weight:700;font-size:12px;white-space:nowrap}
.pbar{display:inline-block;width:64px;height:7px;background:var(--grid);border-radius:4px;vertical-align:middle;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--sub);font-size:12px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* VCマップ */
.vc-label{font-size:12px;color:var(--sub);margin:14px 0 8px;font-weight:700}
.vc-grid{display:grid;gap:8px;align-items:start}
.vc-grid.main{grid-template-columns:repeat(9,minmax(150px,1fr))}
.vc-grid.support{grid-template-columns:repeat(7,minmax(150px,1fr))}
.vc-scroll{overflow-x:auto;padding-bottom:6px}
.vc-col{display:flex;flex-direction:column;gap:6px}
.vc-head{background:#2F3B47;color:#fff;border-radius:8px;padding:10px 12px;cursor:pointer}
.vc-head .t{font-weight:700;font-size:15px}
.vc-head .m{font-size:12px;opacity:.85}
.vc-head.sel{outline:3px solid var(--today);outline-offset:-3px}
.vc-sub{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px}
.vc-sub:hover{border-color:var(--accent-2)}
.vc-sub.sel{outline:2px solid var(--accent);outline-offset:-2px}
.vc-sub.warn{background:var(--late-soft);border-color:#E9B6AB}
.vc-sub.has{background:#F4F8FC}
.vc-sub .m{font-size:12px;color:var(--sub);margin-top:2px}
.vc-sub .w{font-size:12px;color:var(--late);font-weight:700}
.bn-row{border-top:1px solid var(--grid);padding:10px 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.bn-row:first-of-type{border-top:0}
.bn-row .bt{flex:1 1 300px}

/* 表 */
.tbl-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 220px)}
table{border-collapse:separate;border-spacing:0}
.qv{width:100%}
th,td{border-bottom:1px solid var(--grid);padding:8px 10px;text-align:left;vertical-align:middle;font-size:13px}
th{position:sticky;top:0;background:var(--head);z-index:3;font-weight:700;white-space:nowrap;font-size:12px;color:#33404C}
tr.grp td{background:#EEF0EB;font-weight:700;cursor:pointer}
tr.grp2 td{background:#F7F8F5;font-weight:700;cursor:pointer;font-size:13px}
.alink{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:700}
.alink:hover{text-decoration:underline}
.mcell{width:38px;min-width:38px;padding:0;border-left:1px solid var(--grid)}
.mcell.on{background:var(--bar-leaf)}
.mcell.end{background:var(--bar-end)}
.mcell.now{box-shadow:inset 2px 0 0 var(--today)}
th.mh{font-size:11px;padding:6px 2px;text-align:center;min-width:38px}

/* ガント */
.pj-head{display:grid;grid-template-columns:1fr auto;gap:16px;margin-bottom:14px}
.pj-head .info{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:8px}
.pj-head .info b{color:var(--ink)}
.gantt td{padding:6px 10px;height:40px;background:var(--panel)}
.gantt .stk{position:sticky;z-index:2;background:var(--panel)}
.gantt th.stk{z-index:5;background:var(--head)}
.gantt tr.lv1 td{background:#F8F9F6}
.gantt tr.lv1 td.stk{background:#F8F9F6}
.gantt tr.lv0 td,.gantt tr.lv0 td.stk{background:#EEF2F7}
.gantt td.lastinfo{box-shadow:inset -1px 0 0 #B9BFB4}
.nmw{display:flex;align-items:flex-start;gap:4px}
.nmw .tx{flex:1;word-break:break-all}
.nmw .tx.ed{cursor:text;border-radius:4px;padding:0 2px}
.nmw .tx.ed:hover{background:var(--soft)}
.nmw input{flex:1;border:1px solid var(--accent-2);border-radius:4px;padding:2px 6px}
.tg{display:inline-block;width:18px;flex:none;text-align:center;color:var(--sub);cursor:pointer;user-select:none}
.acts{display:flex;gap:1px;flex:none;opacity:0}
tr:hover .acts{opacity:1}
.acts button{border:0;background:transparent;color:var(--sub);padding:1px 5px;border-radius:4px;font-size:12px}
.acts button:hover{background:var(--grid);color:var(--ink)}
.clk{cursor:pointer;border-radius:4px}
.clk:hover{background:var(--soft)}
.gantt select{border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#fff;width:100%}
.gantt input[type=number]{width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.tl{width:28px;min-width:28px;padding:0!important;border-left:1px solid var(--grid)}
.tl.day{width:22px;min-width:22px}
.tl.m1{border-left:1px solid #9FA79A}
.tl.we{background:var(--wkend)}
.tl.pick{cursor:pointer}
.tl.pick:hover{background:var(--soft)}
.tl.bar{background:var(--bar)}
.tl.bar.leaf{background:var(--bar-leaf)}
.tl.bar.endw{background:var(--bar-end)}
.tl.bar.late{background:#E07A66}
.tl.today{box-shadow:inset 2px 0 0 var(--today)}
.tl.dl{box-shadow:inset -3px 0 0 #1D2226}
th.tl{font-size:10px;text-align:center;color:var(--sub);font-weight:400;padding:4px 0!important}
th.mon{text-align:left;font-size:12px;border-left:1px solid #9FA79A;padding:6px 6px!important;top:0}
.gantt thead tr:nth-child(2) th{top:33px}
.legend{font-size:12px;color:var(--sub);display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
.legend i{display:inline-block;width:14px;height:10px;vertical-align:middle;margin-right:4px}

/* フォーム・モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,28,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;max-width:680px;width:100%;padding:22px 24px}
.modal h3{margin:0 0 14px;font-size:17px}
.form{display:grid;grid-template-columns:150px 1fr;gap:12px 14px;align-items:center}
.form label{font-size:13px;color:var(--sub)}
.form input:not([type=checkbox]),.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:#fff}
.form.one{grid-template-columns:1fr;gap:6px}
.form.one label.req,.form.one>label{margin-top:8px;font-weight:700;color:var(--ink)}
.picker{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FAFBF8}
.pk-g{margin-bottom:10px}.pk-g:last-child{margin-bottom:0}
.pk-gl{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
.pk-items{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;cursor:pointer}
.pill input{position:absolute;opacity:0;width:0;height:0}
.pill span{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;white-space:nowrap;user-select:none}
.pill:hover span{border-color:var(--accent-2)}
.pill input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.pill input:focus-visible+span{outline:2px solid var(--accent-2);outline-offset:2px}
.pk-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.pk-k:first-of-type{border-top:0}
.pk-kl{font-size:12px;color:var(--sub);min-width:160px}
.pk-none{font-size:12px;color:var(--sub)}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);margin:0 0 12px;cursor:pointer}
.remember input{width:18px;height:18px}
.form textarea{min-height:70px}
.form .full{grid-column:1/-1}
.form .req::after{content:" ＊";color:var(--late)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.checks{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.checks label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);padding:3px 0;font-size:13px}
.checks .gl{font-size:11px;color:var(--sub);font-weight:700;margin-top:6px}
.msg{color:var(--late);font-size:13px;min-height:18px;margin-top:6px}
.savebadge{font-size:12px;color:var(--done);background:var(--done-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.savebadge.on{color:#6B4A00;background:var(--warn-soft)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1D2226;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;max-width:90vw}
.toast.err{background:var(--late)}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent-2),transparent);background-size:50% 100%;animation:b 1s linear infinite;z-index:70}
@keyframes b{from{background-position:-50% 0}to{background-position:150% 0}}
.app-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#FFFCF3;margin-bottom:12px}

/* ログイン・登録 */
.login.wide{max-width:760px}
.login{max-width:520px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 30px}
.login h1{font-size:21px;margin:0 0 6px}
.login p{color:var(--sub);font-size:13px}
.login .tabs{display:flex;gap:6px;margin:14px 0 18px}
.login input.big{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px;font-size:16px}
.login .code{letter-spacing:8px;text-align:center;font-size:22px}
.empty{color:var(--sub);padding:26px;text-align:center}
@media (max-width:900px){.form{grid-template-columns:1fr}main{padding:14px}}
</style>
</head>
<body>
<div id="busy" class="busy hidden"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast hidden"></div>
<script>
var S = { token: null, viewAs: '', st: null, tab: 'vc', vcSel: null, pjId: '', exp: {},
  qv: { onlyS: false, onlyLate: false, vc: '', sub: '', fold: {} },
  g: { mode: 'week', compact: false, keep: null },
  login: { mode: 'login', step: 1, email: '', reg: null }, pub: null };
var API_URL = 'https://script.google.com/macros/s/AKfycbyNA5O0s4jwjpHnBVf3sAT9i8cENFDI7V0Ofxb6LqxHrEhun5kBOdvF7vQNneLxsae0/exec';
try { S.token = localStorage.getItem('pjv_token') || sessionStorage.getItem('pjv_token'); } catch (e) { }
function saveToken(t, remember) {
  try { localStorage.removeItem('pjv_token'); sessionStorage.removeItem('pjv_token'); if (t) (remember ? localStorage : sessionStorage).setItem('pjv_token', t); } catch (e) { }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
// Googleの中で開いた時は google.script.run、別の場所（GitHub Pagesなど）に置いた時は通信で呼ぶ
function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.google && google.script && google.script.run) {
    return new Promise(function (res, rej) { var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn].apply(r, args); });
  }
  function once() {
    return fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: fn, args: args }) })
      .then(function (r) { if (!r.ok) { var e = new Error('通信エラー ' + r.status); e.net = true; throw e; } return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.msg || 'エラー'); return j.result; }, function (e) { e.net = true; throw e; });
  }
  // Google側の通信はときどき失敗する（404など）ので、間をあけて最大4回やり直す。書き込みは同じ番号（_rid）で送るので二重にならない
  var waits = [1500, 3000, 5000];
  function attempt(n) {
    return once().catch(function (e) {
      if (!e.net || n >= waits.length) throw e;
      return new Promise(function (r) { setTimeout(r, waits[n]); }).then(function () { return attempt(n + 1); });
    });
  }
  return attempt(0);
}
function busy(on) { $('busy').classList.toggle('hidden', !on); }
var toastT;
function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add('hidden'); }, err ? 6000 : 2500);
}
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
// 書き込みは順番待ちの列に入れて、1つずつ裏で送る（画面は止めない）
var wq = [], wqBusy = false;
function call(action, payload) {
  var write = action && action !== 'state';
  payload = payload || {};
  if (!write) {
    busy(true);
    return run('api', S.token, S.viewAs, 'state', payload).then(function (r) {
      busy(false);
      if (!r.ok) { if (r.auth === false) { logoutLocal(); return null; } toast(r.msg || 'うまくいきませんでした', true); return null; }
      if (!wq.length && !wqBusy) { S.st = r.state; render(); }
      return true;
    }).catch(function () { busy(false); toast('通信できませんでした。少し待ってから画面を読み込み直してください。', true); return null; });
  }
  // 返事が届かなかった操作をもう一度押した時は、前と同じ番号で送る（サーバー側で1回分にまとまる）
  var key = action + JSON.stringify(payload);
  if (!payload._rid) payload._rid = (S.failRid && S.failRid[key]) || rid();
  return new Promise(function (resolve) { wq.push({ action: action, payload: payload, key: key, resolve: resolve }); pump(); });
}
function pump() {
  if (wqBusy || !wq.length) { busy(wqBusy); savingBadge(); return; }
  wqBusy = true; busy(true); savingBadge();
  var job = wq.shift();
  run('api', S.token, S.viewAs, job.action, job.payload).then(function (r) {
    wqBusy = false;
    if (S.failRid) delete S.failRid[job.key];
    if (!r.ok) {
      if (r.auth === false) { wq = []; logoutLocal(); job.resolve(null); return; }
      toast(r.msg || 'うまくいきませんでした', true);
      if (r.state) { S.st = r.state; render(); } else refreshAfterFail();
      job.resolve(null);
    } else {
      // 列に次の保存が残っている時は、画面を上書きしない（先に反映した変更が一瞬戻るのを防ぐ）
      if (!wq.length) { S.st = r.state; render(); }
      job.resolve(r.result || true);
    }
    pump();
  }).catch(function () {
    wqBusy = false;
    S.failRid = S.failRid || {}; S.failRid[job.key] = job.payload._rid;
    toast('通信が不安定でした。保存できたかを確かめています…', true);
    refreshAfterFail();
    job.resolve(null);
    pump();
  });
}
function refreshAfterFail() {
  run('api', S.token, S.viewAs, 'state', {}).then(function (r) { if (r && r.ok && !wq.length && !wqBusy) { S.st = r.state; render(); toast('画面を最新にしました。保存されていれば、もう一度押さなくて大丈夫です。'); } }).catch(function () { });
}
function savingBadge() {
  var el = $('saving'); if (!el) return;
  var n = wq.length + (wqBusy ? 1 : 0);
  el.textContent = n ? '保存中…（' + n + '件）' : '保存済み';
  el.className = 'savebadge' + (n ? ' on' : '');
}
// 状態・日付・進捗などは、押した瞬間に画面に反映してから裏で保存する
function quickUpdate(id, fields) {
  var it = byId(id);
  if (it) {
    Object.keys(fields).forEach(function (k) { it[k] = k === 'assignees' ? String(fields[k]).split(',').filter(Boolean) : fields[k]; });
    recompute(); render();
  }
  return call('updateItem', { id: id, fields: fields });
}
// サーバーと同じ計算（子から親へ：日付・進捗・状態・遅れ）を画面側でもする
function recompute() {
  var list = S.st.items, today = S.st.today, kidsOf = {}, res = {};
  list.forEach(function (i) { (kidsOf[i.parentId || ''] = kidsOf[i.parentId || ''] || []).push(i); });
  function calc(it) {
    if (res[it.id]) return res[it.id];
    var ch = (kidsOf[it.id] || []).slice().sort(function (a, b) { return a.order - b.order; }), r;
    if (!ch.length) {
      var st = it.status || '未着手';
      var pr = st === '完了' ? 100 : st === '未着手' ? 0 : (it.progress !== '' && it.progress != null && !isNaN(Number(it.progress)) ? Number(it.progress) : (st === '進行中' ? 50 : 0));
      var late = !!(it.end && it.end < today && st !== '完了' && st !== '保留');

function modal(title, body, onOk, okLabel) {

  $('mf-cancel').onclick = closeModal;

    var b = $('mf-ok'); if (b.disabled) return;

    var r = onOk();

    else closeModal();
  };

  modal('解消するボトルネック', body, function () { return call('setLinks', { pjId: pj.id, bottleneckIds: checked('l-bn') }); });
}
// PJメンバー：ほかの課の人・外部企業の人をこのPJに入れる（入った人はこのPJの工程・タスクを入力できる）
function pjMembersForm(pj) {
  var cur = pj.members || [];
  var mem = S.st.members.filter(function (m) { return m.active && m.role !== '社外コンサル'; });
  var inside = mem.filter(function (m) { return !m.outside; }), outside = mem.filter(function (m) { return m.outside; });
  function row(m) { return '<label><input type="checkbox" class="pm" value="' + esc(m.email) + '"' + (cur.indexOf(m.email) >= 0 ? ' checked' : '') + '><span>' + esc(m.name) + ' <span class="muted">' + esc(m.role) + '・' + esc(m.outside ? m.group : m.depts.join('、')) + '</span></span></label>'; }
  var body = '<p class="muted">このPJの課（' + esc(pj.dept) + '）以外の人や、外部企業の人を入れます。入った人は、このPJを見られて、工程・タスクを入力できます（PJの情報を直す・PJを消すことはできません）。</p>' +
    '<div class="checks">' + (outside.length ? '<div class="gl">外部企業</div>' + outside.map(row).join('') : '') + '<div class="gl">社内</div>' + inside.map(row).join('') + '</div>';
  modal('PJメンバー：' + pj.name, body, function () { return call('setPjMembers', { pjId: pj.id, emails: checked('pm') }); });
}
function bnForm(b, vc, sub) {
  var st = S.st, isNew = !b;
  b = b || { vc: vc || '', sub: sub || '', status: '未着手' };
  var body = '<div class="form"><label class="req">VCの細目</label><select id="b-sub"><option value=""></option>' + subOptions('', b.sub, true) + '</select>' +
    '<label class="req">ボトルネック</label><input id="b-title" value="' + esc(b.title || '') + '" placeholder="何が詰まっているか">' +
    '<label>くわしく</label><textarea id="b-detail">' + esc(b.detail || '') + '</textarea>' +
    '<label>状態</label><select id="b-status">' + ['未着手', '対応中', '解消'].map(function (s) { return '<option' + (s === b.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    (!isNew && st.can.admin ? '<p style="margin-top:12px"><button class="btn danger small" id="b-del">このボトルネックを消す</button></p>' : '');
  modal(isNew ? 'ボトルネックを足す' : 'ボトルネックを直す', body, function () {
    return call('saveBottleneck', { id: b.id, sub: fv('b-sub'), title: fv('b-title'), detail: fv('b-detail'), status: fv('b-status') });
  });
  if ($('b-del')) $('b-del').onclick = function () { if (confirm('消しますか？つながっているPJからも外れます。')) { closeModal(); call('deleteBottleneck', { id: b.id }); } };
}
function whoForm(it) {
  var mem = S.st.members.filter(function (m) { return m.active; });
  var cur = it.assignees.map(function (a) { return a.toLowerCase(); });
  var others = it.assignees.filter(function (a) { return a.indexOf('@') < 0; });
  var body = '<p class="muted">アプリのメンバーはチェックで選びます。社外の人やまだ登録していない人は、下に名前を書きます（「, 」区切り）。</p><div class="checks">' +
    mem.map(function (m) { return '<label><input type="checkbox" class="w-m" value="' + esc(m.email) + '"' + (cur.indexOf(m.email) >= 0 ? ' checked' : '') + '><span>' + esc(m.name) + ' <span class="muted">' + esc(m.role) + '・' + esc(m.depts.join('、')) + '</span></span></label>'; }).join('') +
    '</div><div class="form" style="margin-top:12px"><label>社外・その他</label><input id="w-other" value="' + esc(others.join(', ')) + '" placeholder="例：大塚さん（外部）, 専務"></div>';
  modal('担当：' + it.name, body, function () {
    var list = checked('w-m').concat(fv('w-other').split(/[,、，]/).map(function (x) { return x.trim(); }).filter(Boolean));
    quickUpdate(it.id, { assignees: list.join(',') }); return true;
  });
}
function dateForm(it) {
  var body = '<div class="form"><label>開始</label><input type="date" id="d-s" value="' + esc(it.start) + '"><label>期限</label><input type="date" id="d-e" value="' + esc(it.end) + '"></div>';
  modal('日付：' + it.name, body, function () { var s0 = fv('d-s'), e0 = fv('d-e'); if (s0 && e0 && s0 > e0) { $('mf-msg').textContent = '開始日が期限より後になっています。'; return false; } quickUpdate(it.id, { start: s0, end: e0 }); return true; });
}
function detailForm(it) {
  var full = it.edit === 'full' || it.edit === 'member';
  var body = '<div class="form"><label>完了の条件（クオリティ）</label><textarea id="d-q"' + (full ? '' : ' disabled') + '>' + esc(it.quality) + '</textarea>' +
    '<label>振り返り（抜け漏れ・スキル）</label><textarea id="d-r">' + esc(it.review) + '</textarea>' +
    '<label>メモ</label><textarea id="d-m">' + esc(it.memo) + '</textarea>' +
    '<label>最終更新</label><div class="muted">' + esc(it.updatedBy) + ' ' + esc(jst(it.updatedAt)) + '</div></div>';
  modal(it.name, body, function () { var f = { review: fv('d-r'), memo: fv('d-m') }; if (full) f.quality = fv('d-q'); quickUpdate(it.id, f); return true; });
}
function memberForm(m) {
  var st = S.st, isNew = !m;
  m = m || { role: '一般', depts: [], kakaris: [], active: true };
  var body = '<div class="form"><label class="req">メール</label><input id="m-email" value="' + esc(m.email || '') + '"' + (isNew ? '' : ' disabled') + '>' +
    '<label class="req">名前</label><input id="m-name" value="' + esc(m.name || '') + '">' +
    '<label class="req">役職</label><select id="m-role">' + st.roles.map(function (r) { return '<option' + (r === m.role ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>' +
    '<label class="m-in">課（兼務は全部）</label><div class="m-in">' + picker('m', m.depts, m.kakaris, st.org)[0] + '</div><label class="m-in">係</label><div class="m-in">' + picker('m', m.depts, m.kakaris, st.org)[1] + '</div>' +
    '<label class="m-out">会社名</label><input class="m-out" id="m-company" value="' + esc(m.outside ? m.group : '') + '">' +
    '<label>状態</label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="m-active" style="width:auto"' + (m.active ? ' checked' : '') + '> 有効（ログインできる）</label></div>' +
    '<p class="muted">管理者は役職で自動に決まります（取締役・執行役員・部長）。部長以上・社外コンサルの付け外しは、取締役か小林部長だけができます。外部企業の方が見られるPJは、PJのガントの「PJメンバー」で決めます。</p>';
  modal(isNew ? 'メンバーを足す' : 'メンバーを直す', body, function () {
    return call('saveMember', { email: isNew ? fv('m-email') : m.email, name: fv('m-name'), role: fv('m-role'), depts: checked('m-d').join(','), kakaris: checkedK('m-k').join(','), company: fv('m-company'), active: $('m-active').checked });
  });
  var outs = st.rolesOutside || [];
  var sw = function () { var o = outs.indexOf($('m-role').value) >= 0; document.querySelectorAll('#modal .m-in').forEach(function (e) { e.style.display = o ? 'none' : ''; }); document.querySelectorAll('#modal .m-out').forEach(function (e) { e.style.display = o ? '' : 'none'; }); };
  $('m-role').onchange = sw; sw();
}

// ---------- 起動 ----------
if (S.token) call('state'); else renderLogin();
</script>
</body>
</html>
